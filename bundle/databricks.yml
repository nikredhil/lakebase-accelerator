# Databricks Asset Bundle — deploys the code_migration use-case assets (job that
# runs the migration pipeline) onto infra provisioned by Terraform.
#
# Validate:  databricks bundle validate -t dev
# Deploy:    databricks bundle deploy   -t dev
# Run:       databricks bundle run migration_pipeline -t dev
# Destroy:   databricks bundle destroy  -t dev      (removes the job; stops its billing)
#
# The accelerator CLI (`accelerator deploy/destroy code_migration`) calls these
# so infra (Terraform) and assets (DAB) spin up and tear down together.

bundle:
  name: lakebase-code-migration

variables:
  existing_cluster_id:
    description: Cluster id from `terraform output cluster_id` (the accelerator injects it).
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: ${DATABRICKS_HOST}

resources:
  jobs:
    migration_pipeline:
      name: "[lakebase] code_migration pipeline"
      tags:
        project: lakebase-accelerator
        usecase: code_migration
      tasks:
        - task_key: run_migration
          # Reuse the Terraform-provisioned cluster when an id is passed, else a
          # tiny job cluster (1-2 nodes) so the bundle is self-contained.
          existing_cluster_id: ${var.existing_cluster_id}
          spark_python_task:
            python_file: ../usecases/code_migration/run.py
            parameters: ["--example", "all", "--backend", "databricks"]
