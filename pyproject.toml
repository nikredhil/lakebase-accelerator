[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lakebase-accelerator"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "databricks-sdk>=0.30.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
lakebase = "accelerator.cli:main"
