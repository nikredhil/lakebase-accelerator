# Lakebase Accelerator — DAB bundle definition.
#
# This is the top-level bundle that syncs the accelerator code + notebook to
# a Databricks workspace.  The actual cluster resources are generated per-use-case
# by accelerator/dab.py into .lakebase/<usecase>/databricks.yml.
#
# Usage:
#   databricks bundle deploy -t dev    # push notebook + source to workspace
#   lakebase deploy <name>             # provision use-case infra (cluster, schema)

bundle:
  name: lakebase-accelerator

sync:
  include:
    - "accelerator/**/*.py"
    - "notebooks/**"
    - "usecases/**"
    - "app/**"
    - "agent_app/**"

resources:
  apps:
    # Control plane: deploy/monitor/destroy Lakebase instances + cost center.
    lakebase_ui:
      name: lakebase-accelerator
      description: "Red/white control-plane UI: deploy/monitor/destroy Lakebase instances + cost center."
      source_code_path: ./app

    # Stateful Agent Backbone: the live agent chat app (separate app).
    lakebase_agent_backbone:
      name: lakebase-agent-backbone
      description: "Stateful Agent Backbone — chat agent with memory in governed Lakebase Postgres."
      source_code_path: ./agent_app

targets:
  dev:
    default: true
    mode: development
    presets:
      name_prefix: ""   # app names must be lowercase-hyphen only; skip the [dev user] prefix
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  staging:
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/staging

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/prod
